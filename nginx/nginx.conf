worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    proxy_buffering off;
    proxy_request_buffering off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        allow all;

        auth_basic "HomeLab Library";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            auth_basic off;
        }

        location /tasks/ {
            proxy_pass http://kanboard:80/;
            proxy_set_header Host $host;
        }
        
        location /libs/ {
            auth_basic off;
            alias /usr/share/nginx/html/libs/;
        }
        
        # -------------------- MAPLIBRE FILES (NO AUTH) --------------------
        location = /maplibre-gl.js {
            auth_basic off;
            allow all;
            root /usr/share/nginx/html;
        }
        
        location = /maplibre-gl.css {
            auth_basic off;
            allow all;
            root /usr/share/nginx/html;
        }
        
        location /files/ {
            proxy_pass http://filebrowser:80/;
            proxy_set_header Host $host;
        }
        
        location /notes/ {
            proxy_pass http://trilium:8080/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /maps/ {
            auth_basic off;
            proxy_pass http://tileserver:8080/;
            proxy_set_header Host $host;
        }

        location /api/glances/ {
            auth_basic off;
            proxy_pass http://glances:61208/api/4/;
        }

        location /monitor/ {
            proxy_pass http://glances:61208/;
        }

        location /reader/ {
            proxy_pass http://calibre-web:8083/;
            proxy_set_header Host $host;
        }

        location /books/ {
            alias /usr/share/nginx/html/books/;
            autoindex on;
        }
        
        # -------------------- NAVIDROME (??????) --------------------
        location /music/ {
            auth_basic off;  # ??? ????????, ???? ?????? ??????
            proxy_pass http://navidrome:4533/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_redirect http://navidrome:4533/ /music/;
        }
        
        location = /music {
            return 301 /music/;
        }
    }
}
